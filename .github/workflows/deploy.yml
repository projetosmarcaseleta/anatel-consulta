name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            TARGET_DIR="$HOME/anatel-consulta"

            if [ ! -d "$TARGET_DIR" ]; then
              echo "📦 Pasta não encontrada. Clonando repositório pela primeira vez..."
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$TARGET_DIR"
              cd "$TARGET_DIR"

              if [ ! -f ".env" ]; then
                echo "⚙️ Criando .env a partir de .env.example..."
                cp .env.example .env
              fi

              echo "🐳 Subindo banco de dados e aplicação..."
              docker compose up -d --build
            else
              cd "$TARGET_DIR"

              echo "⬇️ Atualizando código..."
              git pull https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main

              echo "🐳 Reconstruindo aplicação..."
              docker compose up -d --build app
            fi

            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Deploy concluído com sucesso!"
